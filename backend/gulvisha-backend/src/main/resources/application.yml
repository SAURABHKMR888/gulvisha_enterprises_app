spring:
  application:
    name: gulvisha-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gulvisha}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgress}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-change-me-in-production-min-32-chars}
    expiration: ${JWT_EXPIRATION:86400000}